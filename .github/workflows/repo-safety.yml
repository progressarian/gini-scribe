name: Repo safety

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  repo-safety:
    name: Malware pattern check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-repo-safety.mjs
