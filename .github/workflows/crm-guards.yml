name: CRM guards

# Runs on every commit. Three guards, in cost order:
#
#   1. role-switch    — no CRM file may reach the database outside withCrmContext
#   2. vocab-drift    — shared/crmVocab.js and the CHECK constraints must agree
#   3. compliance     — no incentive/commission/payout object may exist in `crm`
#   4. rls            — the full 72-assertion access-control suite, run twice:
#                       once on a fresh database, once as a rehearsal of the
#                       production migration path
#
# Guard 2 matters most on Supabase. CREATE EVENT TRIGGER requires superuser,
# which Supabase does not grant, so the in-database guard may be absent there.
# This job is the backstop that makes the NMC fee-splitting rule enforced
# regardless of what the database will accept.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  role-switch-guard:
    name: Static CRM guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node server/crm/checkNoDirectPool.mjs
      - run: node server/crm/checkVocabSync.mjs
      # The offline queue needs no database — it is plain JS over localStorage,
      # which the script stubs. Runs here so a regression is caught in seconds.
      - run: node server/scripts/smoke-crm-offline-queue.mjs

  crm-schema:
    name: Compliance + RLS suite (pg${{ matrix.pg }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 17 is what Supabase runs in production (17.6 as of this commit).
        # 15 is kept so the schema stays portable.
        pg: ["17", "15"]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crmtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CRM_DSN: postgresql://postgres:postgres@localhost:5432/crmtest
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      # The visit suite runs the real server modules, so it needs the server's
      # own dependencies — the repo keeps two separate node_modules trees.
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Apply the CRM migration chain
        working-directory: server/migrations
        run: |
          set -e
          psql "$CRM_DSN" -v ON_ERROR_STOP=1 -q -f crm/_scratch_scribe_stub.sql
          for f in 2026-09-16_crm_phase1.sql 2026-09-16_crm_phase1_rls.sql \
                   2026-10-01_crm_registration.sql \
                   2026-10-03_crm_registration_record_fn.sql \
                   2026-10-02_crm_inbound_attribution_comments.sql \
                   2026-10-04_crm_doctor_skeleton_records.sql \
                   2026-10-05_crm_referral_capture.sql; do
            echo "== $f"
            psql "$CRM_DSN" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Migrations are idempotent
        working-directory: server/migrations
        run: |
          set -e
          for f in 2026-09-16_crm_phase1.sql 2026-09-16_crm_phase1_rls.sql \
                   2026-09-30_crm_enums_to_text.sql \
                   2026-10-01_crm_registration.sql \
                   2026-10-03_crm_registration_record_fn.sql \
                   2026-10-02_crm_inbound_attribution_comments.sql \
                   2026-10-04_crm_doctor_skeleton_records.sql \
                   2026-10-05_crm_referral_capture.sql; do
            psql "$CRM_DSN" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "every migration re-ran cleanly" 

      - name: NMC compliance check
        working-directory: server/migrations/crm
        run: ./ci_compliance_check.sh "$CRM_DSN"

      - name: Seed fixtures
        working-directory: server/migrations/crm
        run: psql "$CRM_DSN" -v ON_ERROR_STOP=1 -q -f _scratch_fixtures.sql

      - name: RLS verification suite
        working-directory: server/migrations/crm
        run: ./verify_rls.sh

      - name: Referral capture and attribution
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crmtest
        run: node scripts/smoke-crm-referrals.mjs

      - name: Visit logging and rep home
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crmtest
        run: node scripts/smoke-crm-visits.mjs
